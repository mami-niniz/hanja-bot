name: 매일 한자 발송

on:
  schedule:
    - cron: '50 22 * * *'
    - cron: '20 23 * * *'
    - cron: '50 23 * * *'
    - cron: '0 3 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - normal
          - chatid
          - dry

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 내려받기
        uses: actions/checkout@v4

      - name: 한자 발송
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          START_DATE: '2026-10-14'
          REVIEW_ON_SUNDAY: 'true'
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'normal' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python3 send_hanja.py

      - name: 발송 기록 저장
        run: |
          if [ -n "$(git status --porcelain last_sent.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last_sent.txt
            git commit -m "chore: 발송 기록 $(date -u +%F)"
            git push || { git pull --rebase --autostash && git push; }
          else
            echo "기록 변화 없음"
          fi
